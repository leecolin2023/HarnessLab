name: Model serving static checks
on:
  pull_request:
    paths:
      - "04-experiments/model-service/ocr-serving-ppocrv6/**"
      - ".github/workflows/model-serving-static.yml"
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile experiment
        run: python -m compileall -q 04-experiments/model-service/ocr-serving-ppocrv6
      - name: Shell syntax check
        run: bash -n 04-experiments/model-service/ocr-serving-ppocrv6/tools/run_once.sh
      - name: Unit tests (without Paddle weights)
        run: python -m unittest discover -s 04-experiments/model-service/ocr-serving-ppocrv6/tests -v
