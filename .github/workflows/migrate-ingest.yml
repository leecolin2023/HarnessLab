name: One-time migration of ingest2md AI learning materials
# Re-run after classification and safe pruning corrections
on:
  push:
    paths:
      - '.github/workflows/migrate-ingest.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read source snapshot and copy materials
        shell: bash
        run: |
          git clone --depth 1 https://github.com/leecolin2023/ingest2md.git "$RUNNER_TEMP/ingest-source"
          python3 tools/migrate_ingest_outputs.py --target harness --source "$RUNNER_TEMP/ingest-source" --root "$GITHUB_WORKSPACE"
      - name: Commit classified materials
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/
          if ! git diff --cached --quiet; then
            git commit -m "archive: import refined and learned AI materials from ingest2md"
            git push origin HEAD:main
          fi
